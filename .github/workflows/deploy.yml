name: Publish browser closure notice
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare closure notice without game binaries
        run: |
          mkdir -p site
          cp public/index.html public/index.offline.html public/index.service.worker.js public/privacy.html public/404.html site/
          touch site/.nojekyll
          test -s site/index.html
          test ! -e site/index.wasm
          test ! -e site/index.pck
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish closure notice
        id: deployment
        uses: actions/deploy-pages@v4
